<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plano de Abertura | Morazzini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1512'/%3E%3Cpath d='M13 42V22h8l11 12 11-12h8v20h-8V32L32 44 21 32v10z' fill='%23f4eee4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body data-page="{{page}}">
  <div class="shell">
    <aside class="sidebar" aria-label="Menu principal">
      <div class="brand">
        <svg class="brand-logo" viewBox="158 182 184 143" role="img" aria-label="Morazzini móveis planejados">
          <image href="Logo/Logo__2_-removebg-preview.png" width="500" height="500" />
        </svg>
      </div>

      <div class="side-rule"></div>

      <nav class="nav-block" aria-label="Planejamento">
        <div class="nav-title">Planejamento</div>
        <a class="nav-item" href="index.html" data-view="opening">
          <span class="nav-icon">01</span>
          Abertura
        </a>
      </nav>

      <div class="side-rule"></div>

      <nav class="nav-block" aria-label="Etapas futuras">
        <div class="nav-title">Gestão</div>
        <a class="nav-item" href="patrimonio.html" data-view="patrimony">
          <span class="nav-icon">02</span>
          Patrimônio
        </a>
        <a class="nav-item" href="financeiro.html" data-view="finance">
          <span class="nav-icon">03</span>
          Financeiro
        </a>
      </nav>

      <div class="status-foot">
        Marcenaria Morazzini<br>
        Painel de abertura
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="breadcrumbs">
          <span>Operações</span>
          <span>/</span>
          <strong>Plano de abertura</strong>
        </div>
        <div class="top-actions">
          <span class="top-pill" id="currentSection">{{title}}</span>
          <span id="today"></span>
          <button class="logout-button" id="logout" type="button" aria-label="Sair" title="Sair" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.36 6.64a9 9 0 1 1-12.72 0"></path>
              <path d="M12 2v10"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="database-bar" aria-label="Avisos do painel" hidden>
        <p id="syncStatus" role="alert" hidden></p>
        <button class="btn" id="retrySync" hidden>Tentar novamente / recarregar</button>
      </section>
      <section class="login-panel" id="loginPanel" hidden>
        <h1>Acessar Morazzini</h1>
        <p>Entre com a senha do painel para acessar os itens e valores.</p>
        <form id="loginForm">
          <label for="dashboardUsername">Usuário</label>
          <input id="dashboardUsername" class="link-input" autocomplete="username" required>
          <label for="dashboardPassword">Senha do painel</label>
          <input id="dashboardPassword" class="link-input" type="password" autocomplete="current-password" required>
          <button class="btn primary" type="submit">Entrar</button>
        </form>
      </section>
      <main class="app" hidden>
{{summary}}
        <section class="workspace">
{{items}}
{{finance}}
        </section>
        </section>
      </main>
    </div>
  </div>

  <template id="machineTemplate">
    <article class="machine">
      <textarea class="machine-name" rows="1" aria-label="Nome da máquina"></textarea>
      <input class="price-input" type="text" inputmode="decimal" aria-label="Valor da máquina">
      <div class="machine-actions" aria-label="Ações da máquina">
        <button class="icon-btn link-btn" type="button" aria-label="Abrir link do produto" title="Abrir link do produto">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path>
            <path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"></path>
          </svg>
        </button>
        <button class="icon-btn purchase-btn" type="button" aria-label="Marcar como comprado" title="Marcar como comprado">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
        </button>
        <button class="icon-btn remove" type="button" aria-label="Remover máquina" title="Remover máquina">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>
    </article>
  </template>

  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/format.js"></script>
  <script defer src="assets/js/state.js"></script>
  <script defer src="assets/js/products.js"></script>
  <script defer src="assets/js/views.js"></script>
  <script defer src="assets/js/sync.js"></script>
  <script defer src="assets/js/navigation.js"></script>
  <script defer src="assets/js/app.js"></script>
</body>
</html>
